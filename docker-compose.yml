services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sps-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql-sqldata:/var/opt/mssql
    restart: unless-stopped

volumes:
  sql-sqldata:
